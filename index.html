<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HTML SAGA – Code Chronicles</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0a0d1c;color:#eef;font-family:system-ui,'Noto Sans Thai',sans-serif;display:flex;justify-content:center}
#app{width:min(100vw,480px);padding:6px}
canvas{width:100%;display:block;border:3px solid #c9d4ff;border-radius:6px;background:#000;image-rendering:pixelated}
#log{min-height:3.6em;font-size:13px;padding:4px 6px;color:#ffd54a}
.win{background:linear-gradient(#1b2a7a,#0f1850);border:3px double #c9d4ff;border-radius:8px;padding:10px;font-size:14px;line-height:1.5;max-height:34vh;overflow:auto}
.win pre{background:#0008;padding:8px;border-radius:4px;overflow-x:auto;color:#9fe;font-size:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
button{font:inherit;background:#162268;color:#fff;border:2px solid #c9d4ff;border-radius:6px;padding:9px;cursor:pointer;touch-action:manipulation}
button:hover,button:focus{background:#ffd54a;color:#112;outline:0}
button:disabled{opacity:.35}
#pad{display:flex;justify-content:space-between;align-items:center;margin-top:8px;user-select:none;-webkit-user-select:none}
.dp{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:4px}
.dp button{padding:0;font-size:18px}
#mb{width:80px;height:52px}
</style></head><body><div id="app"><canvas id="cv" width="480" height="352"></canvas><div id="log"></div><div id="ui"></div>
<div id="pad"><div class="dp"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div><button id="mb">☰ เมนู</button></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),sl=ms=>new Promise(r=>setTimeout(r,ms));
const K='htmlsaga_v1',cv=$('cv'),ctx=cv.getContext('2d'),T=32;
let mode='title',inB=false,B=null,G=null,dir=null,mv=null,fxs=[],LG=[];
function ask(h,ls){return new Promise(r=>{const p=$('ui');p.innerHTML='<div class="win">'+h+'</div><div class="btns"></div>';const b=p.lastChild;ls.forEach((l,i)=>{const e=document.createElement('button'),d=l[0]=='!';e.innerHTML=d?l.slice(1):l;e.disabled=d;e.onclick=()=>{p.innerHTML='';r(i)};b.appendChild(e)})})}
const say=t=>ask(t,['ต่อไป ▶']);
function log(t){LG.push(t);$('log').innerHTML=LG.slice(-3).map(esc).join('<br>')}
// ---------- data ----------
const MAPS={v:{g:'#5a9a4a',h:'#4f8c40',r:['###############','#.............#','#.T..#####..T.#','#....#...#....#','#....##.##.S..#','#..C..........E','#.............#','#.T.........T.#','#.............#','#.............#','###############'],npcs:[{x:6,y:6,id:'t1',c:'#fd8'},{x:3,y:7,id:'shop',c:'#8df'}]},
f:{g:'#2f6b3a',h:'#285e33',enc:.1,r:['###############','#T...T....T...#','#.............#','#..TT...TT....#','#.............#','W.....T.....B.#','#.............#','#..TT...TT.C..#','#.............#','#.S...T.......#','###############'],npcs:[{x:3,y:5,id:'t2',c:'#fd8'}]}};
const P=[{n:'Arin',cls:'Syntax Knight',mhp:70,mmp:14,atk:12,def:8,spd:6,c:'#59f',gr:[9,2,3,2,1]},{n:'Mira',cls:'Tag Mage',mhp:45,mmp:30,atk:10,def:4,spd:7,c:'#c5f',gr:[5,5,3,1,1]},{n:'Leon',cls:'Debug Ranger',mhp:55,mmp:18,atk:11,def:5,spd:10,c:'#4c7',gr:[7,3,3,1,2]},{n:'Nia',cls:'Element Healer',mhp:50,mmp:28,atk:7,def:5,spd:8,c:'#fb6',gr:[6,5,2,1,1]}];
const SK={Arin:{s:{n:'Fix Syntax',mp:4,t:'syntax',p:1.7}},Mira:{s:{n:'Close Tag',mp:5,t:'tag',p:1.9},m:{n:'<h1> Bolt (ทั้งหมด)',mp:9,t:'tag',p:1.1,all:1}},Leon:{s:{n:'href Shot',mp:4,t:'attr',p:1.6},m:{n:'alt Scan (เปิดจุดอ่อน)',mp:3,k:'scan'}},Nia:{s:{n:'<p> Heal / ชุบชีวิต',mp:5,k:'heal',v:45},m:{n:'<ul> Mend (ทั้งทีม)',mp:10,k:'heal',v:30,all:1}}};
const E={slime:{n:'Bug Slime',mhp:40,atk:9,def:2,spd:4,weak:'syntax',exp:18,g:12,c:'#6c6'},knight:{n:'Broken Tag Knight',mhp:60,atk:12,def:5,spd:6,weak:'tag',exp:30,g:25,c:'#b86'},boss:{n:'The Broken Tag',mhp:220,atk:14,def:6,spd:7,weak:'tag',exp:150,g:200,c:'#c4a',boss:1}};
const WN={syntax:'Syntax',tag:'Tag',attr:'Attribute'};
const LS={1:{t:'บทที่ 1: โครงสร้าง HTML',d:'เอกสาร HTML เริ่มด้วย DOCTYPE แล้วมี &lt;html&gt; ที่ครอบ &lt;head&gt; (ข้อมูลของหน้า) และ &lt;body&gt; (เนื้อหาที่ผู้ใช้เห็น) แท็กที่เปิดต้องปิดให้ถูกลำดับ',code:'<!DOCTYPE html>\n<html>\n  <head><title>Codea</title></head>\n  <body><h1>Hello</h1></body>\n</html>'},
2:{t:'บทที่ 2: หัวข้อและข้อความ',d:'&lt;h1&gt; ถึง &lt;h6&gt; คือหัวข้อ (h1 ใหญ่สุด) &lt;p&gt; คือย่อหน้า &lt;strong&gt; ทำตัวหนา &lt;br&gt; ขึ้นบรรทัดใหม่ (ไม่ต้องปิด)',code:'<h1>Codea</h1>\n<p>ข้อความ <strong>สำคัญ</strong><br>บรรทัดใหม่</p>'}};
const QB=[{ch:1,q:'ส่วนใดเก็บเนื้อหาที่แสดงบนหน้าเว็บ?',o:['<head>','<body>','<html>','<title>'],a:1,e:'<body> เก็บเนื้อหาที่ผู้ใช้เห็น ส่วน <head> เก็บข้อมูลของหน้า'},
{ch:1,q:'แก้โค้ด: <html><body><h1>Hi</h1></html> ผิดตรงไหน?',o:['ลืมปิด </body> ก่อน </html>','ต้องเพิ่ม <br>','ต้องลบ <h1>','ไม่ผิด'],a:0,e:'<body> เปิดแล้วต้องปิดก่อนปิด <html> (ปิดตามลำดับซ้อนใน)'},
{ch:2,q:'แท็กหัวข้อที่ใหญ่ที่สุดคือ?',o:['<h6>','<head>','<h1>','<p>'],a:2,e:'<h1> ใหญ่สุด และ <h6> เล็กสุด'},
{ch:2,q:'แก้โค้ด: <h1>ชื่อเกม</h2> ควรแก้อย่างไร?',o:['เปลี่ยน </h2> เป็น </h1>','ลบ <h1>','เพิ่ม <br>','เปลี่ยน <h1> เป็น <p>'],a:0,e:'แท็กเปิดและแท็กปิดต้องเป็นชนิดเดียวกัน'},
{ch:2,q:'ต้องการตัวหนา ควรใช้แท็กใด?',o:['<strong>','<br>','<h6>','<body>'],a:0,e:'<strong> ทำให้ข้อความสำคัญ/ตัวหนา'},
{ch:3,q:'Attribute ใดกำหนดปลายทางของลิงก์ <a>?',o:['src','alt','href','title'],a:2,e:'href คือที่อยู่ปลายทางของลิงก์ ส่วน src ใช้กับรูปภาพ'}];
// ---------- game state ----------
function newG(){return{party:P.map(p=>({...p,hp:p.mhp,mp:p.mmp,lv:1,exp:0,pi:true})),gold:30,items:{potion:3,ether:1},flags:{},learned:{},map:'v',x:13,y:5}}
const hasSave=()=>{try{return !!localStorage.getItem(K)}catch(e){return false}};
function save(){try{localStorage.setItem(K,JSON.stringify(G));return true}catch(e){return false}}
function load(){try{const g=JSON.parse(localStorage.getItem(K));if(!g||!g.party||!MAPS[g.map])return false;g.party.forEach(m=>m.pi=true);G=g;return true}catch(e){return false}}
async function run(fn){mode='busy';dir=null;try{await fn()}catch(e){console.error(e)}inB=false;mode='explore'}
async function title(){mode='title';inB=false;const i=await ask('<h2 style="margin:0">HTML SAGA</h2><i>CODE CHRONICLES</i><br>ผจญภัยในโลก Codea เรียน HTML ผ่านการต่อสู้',['New Game',hasSave()?'Continue':'!Continue']);
 if(i==1&&load()){mode='explore';return}G=newG();
 await run(async()=>{await say('โลก Codea ถูก <b>Null Corruption</b> กัดกร่อน แท็กถูกบิดเบือนและมอนสเตอร์เกิดจากโค้ดที่ผิดพลาด');await say('คุณและเพื่อน 4 คนได้รับพลังจาก Core of Syntax ไปคุยกับครูไลลาในหมู่บ้านเพื่อเรียนรู้ แล้วออกเดินทางผ่านประตูทางขวา! (เดิน: WASD / ลูกศร / ปุ่มบนจอ)')})}
// ---------- quiz ----------
async function quizQ(q){let first=true;while(1){const i=await ask('<b>'+esc(q.q)+'</b>',q.o.map(esc));if(i==q.a){await say('✔ ถูกต้อง! '+esc(q.e));return first}first=false;const j=await ask('✘ ยังไม่ถูก: '+esc(q.e),['ลองใหม่','ข้าม']);if(j==1)return false}}
async function teach(ch){const L=LS[ch];await say('<b>'+L.t+'</b><br>'+L.d+'<pre>'+esc(L.code)+'</pre>');let ok=true;for(const q of QB.filter(q=>q.ch==ch))if(!await quizQ(q))ok=false;
 if(!G.learned[ch]){G.learned[ch]=1;const l=gain(40);G.items.potion++;if(ok)G.items.ether++;await say('เรียนจบ! ได้ EXP 40 + Potion'+(ok?' + Ether (ตอบถูกครั้งแรกทุกข้อ)':'')+'<br>'+l.join('<br>'));save()}else await say('ทบทวนบทเรียนเรียบร้อย')}
function gain(x){const out=[];G.party.forEach(m=>{if(m.hp<=0)return;m.exp+=x;while(m.exp>=m.lv*35){m.exp-=m.lv*35;m.lv++;const g=m.gr;m.mhp+=g[0];m.mmp+=g[1];m.atk+=g[2];m.def+=g[3];m.spd+=g[4];m.hp=Math.min(m.mhp,m.hp+g[0]);out.push('🌟 '+m.n+' Lv '+m.lv+' (HP+'+g[0]+' MP+'+g[1]+' ATK+'+g[2]+' DEF+'+g[3]+' SPD+'+g[4]+')')}});return out}
// ---------- NPC / tiles ----------
async function talk(id){await run(async()=>{
 if(id=='t1'){await say('ครูไลลา: ยินดีต้อนรับ ผู้กล้า! ความรู้ HTML คือพลังของเรา แต่ไม่บังคับ ตอบผิดก็เล่นต่อได้');if(!G.flags.q1){G.flags.q1=1}if(await ask('ครูไลลา: อยากเรียนบทไหน?',['บทที่ 1 โครงสร้าง HTML','ไว้ก่อน'])==0)await teach(1)}
 else if(id=='t2'){await say('ครูเอลเดน: ป่าแห่งแท็กนี้ถูก The Broken Tag ยึดครอง ทางขวาสุดคือที่อยู่ของมัน!');if(await ask('ครูเอลเดน: ฟังบทเรียนไหม?',['บทที่ 2 หัวข้อและข้อความ','ไว้ก่อน'])==0)await teach(2)}
 else if(id=='shop'){while(1){const i=await ask('พ่อค้า: Gold ของคุณ '+G.gold+' (Potion '+G.items.potion+' / Ether '+G.items.ether+')',['Potion 20g','Ether 30g','ออกจากร้าน']);if(i==2)break;const c=i?30:20;if(G.gold<c)log('Gold ไม่พอ');else{G.gold-=c;G.items[i?'ether':'potion']++;log('ซื้อแล้ว')}}}})}
async function arrive(){const m=MAPS[G.map],c=m.r[G.y][G.x];
 if(c=='E'){G.map='f';G.x=1;G.y=5;dir=null;return}if(c=='W'){G.map='v';G.x=13;G.y=5;dir=null;return}
 if(c=='S')return run(async()=>{G.party.forEach(p=>{p.hp=p.mhp;p.mp=p.mmp});save();await say('✨ คริสตัลฟื้นฟู HP/MP ทั้งทีม และบันทึกเกมแล้ว')});
 if(c=='C'&&!G.flags['c'+G.map])return run(async()=>{G.flags['c'+G.map]=1;if(G.map=='v'){G.items.potion+=2;await say('เปิดหีบ: ได้ Potion ×2')}else{G.items.ether++;G.gold+=60;await say('เปิดหีบ: ได้ Ether ×1 และ 60 Gold')}});
 if(c=='B'&&!G.flags.boss)return run(async()=>{await say('<b>The Broken Tag</b> ปรากฏตัว! แท็กเปิดที่ไม่เคยปิดไหลวนรอบตัวมัน...');await battle(['boss'],true)});
 if(m.enc&&c=='.'&&Math.random()<m.enc)return run(async()=>{const n=1+Math.floor(Math.random()*3);await battle(Array.from({length:n},()=>Math.random()<.6?'slime':'knight'),false)})}
// ---------- battle ----------
const fp=f=>{const i=B.foes.indexOf(f);return f.boss?{x:130,y:170,s:2.6}:{x:70+(i%2)*100,y:100+Math.floor(i/2)*85,s:1}};
const pp=d=>d.pi?{x:380,y:50+G.party.indexOf(d)*70}:fp(d);
function fx(d,txt,col){const p=pp(d);fxs.push({x:p.x,y:p.y-24,txt,col,l:60})}
function hit(a,d,p,t){const w=t&&d.weak===t;let v=(a.atk*p-d.def*0.6*(d.g?2:1))*(0.9+Math.random()*.2)*(w?1.5:1)*(a.pi?B.buff:1);v=Math.max(1,Math.round(v));d.hp=Math.max(0,d.hp-v);d.hit=14;fx(d,v+(w?' WEAK!':''),w?'#ffd54a':'#fff');if(d.hp==0)log(d.n+' ล้มลง');return v}
const over=()=>!B.foes.some(f=>f.hp>0)?'win':!G.party.some(m=>m.hp>0)?'lose':null;
async function tgt(list){const i=await ask('เลือกเป้าหมาย',list.map(x=>esc(x.n)+' '+x.hp+'/'+x.mhp+(!x.pi&&B.scan?' (แพ้ '+WN[x.weak]+')':'')).concat('« กลับ'));return i<list.length?list[i]:null}
async function pturn(m){m.g=false;while(1){const S=SK[m.n];const c=await ask('<b>'+m.n+'</b> ('+m.cls+') HP '+m.hp+'/'+m.mhp+' MP '+m.mp+'/'+m.mmp,['Attack','Skill',S.m?'Magic':'!Magic','Item','Defend','Escape']);const fl=B.foes.filter(f=>f.hp>0);
 if(c==4){m.g=true;log(m.n+' ตั้งรับ');await sl(400);return}
 if(c==5){if(B.boss){log('หนีจากบอสไม่ได้!');continue}if(Math.random()<.6)return'fled';log('หนีไม่สำเร็จ!');await sl(400);return}
 if(c==0){const t=await tgt(fl);if(!t)continue;log(m.n+' โจมตี '+t.n);hit(m,t,1,null);await sl(550);return}
 if(c==1||c==2){const s=c==1?S.s:S.m;if(m.mp<s.mp){log('MP ไม่พอ');continue}let t;if(s.k=='scan')t='all';else if(s.k=='heal')t=s.all?'all':await tgt(G.party);else t=s.all?'all':await tgt(fl);if(!t)continue;m.mp-=s.mp;log(m.n+' ใช้ '+s.n);
  if(s.k=='scan'){B.scan=true;log('เห็นจุดอ่อนของศัตรูทุกตัว!')}
  else if(s.k=='heal'){(s.all?G.party.filter(x=>x.hp>0):[t]).forEach(x=>{if(x.hp<=0)x.hp=20;else x.hp=Math.min(x.mhp,x.hp+s.v);fx(x,'+'+s.v,'#6f6')})}
  else(s.all?fl:[t]).forEach(x=>hit(m,x,s.p,s.t));await sl(650);return}
 if(c==3){const its=Object.keys(G.items).filter(k=>G.items[k]>0);if(!its.length){log('ไม่มีไอเท็ม');continue}const i=await ask('เลือกไอเท็ม',its.map(k=>(k=='potion'?'Potion (+50 HP)':'Ether (+20 MP)')+' ×'+G.items[k]).concat('« กลับ'));if(i>=its.length)continue;const t=await tgt(G.party.filter(x=>x.hp>0));if(!t)continue;const k=its[i];G.items[k]--;if(k=='potion'){t.hp=Math.min(t.mhp,t.hp+50);fx(t,'+50','#6f6')}else{t.mp=Math.min(t.mmp,t.mp+20);fx(t,'MP+20','#6cf')}log(m.n+' ใช้ไอเท็มกับ '+t.n);await sl(500);return}}}
async function fturn(f){const al=G.party.filter(m=>m.hp>0);if(!al.length)return;const t=al.sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[Math.random()<.4?0:Math.floor(Math.random()*al.length)];
 if(f.boss){if(!f.en&&f.hp<f.mhp/2){f.en=1;f.atk=Math.round(f.atk*1.3);log('⚠ '+f.n+' คลุ้มคลั่ง! ท่าโจมตีรุนแรงขึ้น');await sl(900)}
  if(f.ch){f.ch=0;log(f.n+' ใช้ "Unclosed Tag Storm"!');await sl(500);al.forEach(m=>hit(f,m,1.6,null));await sl(700);return}
  if(B.turn%3==0){f.ch=1;log('⚠ '+f.n+' กำลังรวบรวมพลังแท็กพัง... เตรียมตั้งรับ!');await sl(1000);return}}
 log(f.n+' โจมตี '+t.n);hit(f,t,1,null);await sl(600)}
async function challenge(){const q=QB[Math.floor(Math.random()*QB.length)];await say('⚡ <b>Code Challenge!</b> ตอบถูกเพื่อรับโบนัส (ตอบผิดก็สู้ต่อได้)');if(await quizQ(q)){B.buff=1.3;B.scan=true;G.party.forEach(m=>{if(m.hp>0)m.mp=Math.min(m.mmp,m.mp+5)});log('โบนัส! ดาเมจ ×1.3, MP+5, เห็นจุดอ่อนศัตรู')}else log('ไม่ได้รับโบนัสครั้งนี้')}
async function battle(ids,boss){inB=true;LG=[];$('log').innerHTML='';B={foes:ids.map(id=>({...E[id],id,hp:E[id].mhp})),buff:1,boss,turn:0,scan:false};
 await say('ศัตรูปรากฏ: '+B.foes.map(f=>esc(f.n)).join(', '));if(boss||Math.random()<.4)await challenge();
 let res=null;while(!res){B.turn++;const o=[...G.party.filter(a=>a.hp>0),...B.foes.filter(f=>f.hp>0)].sort((a,b)=>b.spd-a.spd);
  for(const a of o){if(a.hp<=0)continue;res=over();if(res)break;if(a.pi){if(await pturn(a)=='fled'){res='fled';break}}else await fturn(a);res=over();if(res)break}}
 G.party.forEach(m=>m.g=false);
 if(res=='win'){const ex=B.foes.reduce((s,f)=>s+f.exp,0),gd=B.foes.reduce((s,f)=>s+f.g,0);G.gold+=gd;let dr='';if(boss){G.items.ether++;dr=' + Ether'}else if(Math.random()<.3){G.items.potion++;dr=' + Potion'}
  const l=gain(ex);inB=false;await say('🏆 ชนะ! EXP '+ex+', '+gd+' Gold'+dr+'<br>'+l.join('<br>'));
  if(boss){G.flags.boss=1;save();await ask('<h3 style="margin:0">ตอนที่ 1 จบ!</h3>The Broken Tag สลายไป ป่าแห่งแท็กกลับมาสงบ คุณได้เรียนบทที่ '+Object.keys(G.learned).join(',')+' ('+Object.keys(G.learned).length+'/7 บทในเกมเต็ม)<br>ยังมีถ้ำ ทะเลทราย และ Null King รออยู่ — โปรดติดตามตอนต่อไป',['กลับสู่โลก Codea'])}}
 else if(res=='lose'){inB=false;G.gold=Math.floor(G.gold/2);G.party.forEach(m=>{m.hp=Math.ceil(m.mhp/2);m.mp=Math.ceil(m.mmp/2)});G.map='v';G.x=13;G.y=5;await say('พ่ายแพ้... ถูกพากลับหมู่บ้าน เสีย Gold ครึ่งหนึ่ง แต่ทีมฟื้นแล้ว')}
 else{inB=false;await say('หนีสำเร็จ!')}
 inB=false;LG=[];$('log').innerHTML=''}
// ---------- menu ----------
async function menu(){await run(async()=>{while(1){const h='<b>ปาร์ตี้</b><br>'+G.party.map(m=>m.n+' Lv'+m.lv+' HP '+m.hp+'/'+m.mhp+' MP '+m.mp+'/'+m.mmp+' ATK '+m.atk+' DEF '+m.def+' SPD '+m.spd+' EXP '+m.exp+'/'+m.lv*35).join('<br>')+'<br><b>ไอเท็ม</b> Potion '+G.items.potion+', Ether '+G.items.ether+' | Gold '+G.gold+'<br><b>ภารกิจ</b><br>'+(G.flags.boss?'✔':'□')+' หลัก: เอาชนะ The Broken Tag<br>'+(G.learned[1]?'✔':'□')+' รอง: เรียนบทที่ 1 &nbsp;'+(G.learned[2]?'✔':'□')+' เรียนบทที่ 2<br>'+(G.flags.cv&&G.flags.cf?'✔':'□')+' รอง: เปิดหีบทั้งสอง<br><b>Codex</b><br>'+Object.keys(G.learned).map(k=>'• '+LS[k].t).join('<br>')||'—';
 const i=await ask(h,['ปิด','บันทึกเกม','รีเซ็ตความคืบหน้า']);if(i==0)break;if(i==1)log(save()?'บันทึกแล้ว':'บันทึกไม่สำเร็จ');if(i==2&&await ask('⚠ ลบความคืบหน้าทั้งหมด? ย้อนกลับไม่ได้',['ลบ','ยกเลิก'])==0){try{localStorage.removeItem(K)}catch(e){}location.reload()}}})}
// ---------- render ----------
function bar(x,y,w,v,m,c){ctx.fillStyle='#000a';ctx.fillRect(x,y,w,5);ctx.fillStyle=c;ctx.fillRect(x,y,w*Math.max(0,v/m),5)}
function human(x,y,c,s=1,bob=0,dead){ctx.save();ctx.translate(x,y+bob);ctx.scale(s,s);if(dead){ctx.rotate(1.5);ctx.globalAlpha=.5}ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(0,14,10,4,0,0,7);ctx.fill();ctx.fillStyle=c;ctx.fillRect(-8,-2,16,16);ctx.fillStyle='#fdc';ctx.beginPath();ctx.arc(0,-8,8,0,7);ctx.fill();ctx.fillStyle=c;ctx.fillRect(-9,-17,18,7);ctx.fillStyle='#223';ctx.fillRect(-4,-8,2,3);ctx.fillRect(2,-8,2,3);ctx.restore()}
function mon(f,x,y,s,t){ctx.save();ctx.translate(x,y+Math.sin(t/300)*3);ctx.scale(s,s);ctx.fillStyle=f.c;if(f.id=='slime'){ctx.beginPath();ctx.ellipse(0,6,22,16,0,0,7);ctx.fill()}else{ctx.fillRect(-16,-18,32,36);ctx.fillRect(-20,-24,8,10);ctx.fillRect(12,-24,8,10)}ctx.fillStyle='#fff';ctx.fillRect(-9,-4,6,8);ctx.fillRect(3,-4,6,8);ctx.fillStyle='#a00';ctx.fillRect(-7,0,3,4);ctx.fillRect(5,0,3,4);ctx.restore()}
function drawMap(t){const m=MAPS[G.map];for(let y=0;y<11;y++)for(let x=0;x<15;x++){const c=m.r[y][x],X=x*T,Y=y*T;ctx.fillStyle=(x+y)%2?m.g:m.h;ctx.fillRect(X,Y,T,T);
  if(c=='#'){ctx.fillStyle='#6a6a7a';ctx.fillRect(X,Y,T,T);ctx.fillStyle='#4a4a5a';ctx.fillRect(X,Y+15,T,2);ctx.fillRect(X+15,Y,2,15)}
  else if(c=='T'){ctx.fillStyle='#5a3a20';ctx.fillRect(X+13,Y+16,6,14);ctx.fillStyle='#1d5a2a';ctx.beginPath();ctx.arc(X+16,Y+14,13,0,7);ctx.fill()}
  else if(c=='S'){ctx.fillStyle='#6cf';ctx.beginPath();ctx.moveTo(X+16,Y+3);ctx.lineTo(X+25,Y+16);ctx.lineTo(X+16,Y+29);ctx.lineTo(X+7,Y+16);ctx.fill()}
  else if(c=='C'){const o=G.flags['c'+G.map];ctx.fillStyle=o?'#654':'#b82';ctx.fillRect(X+5,Y+11,22,15);ctx.fillStyle='#fd4';ctx.fillRect(X+14,Y+15,4,5)}
  else if(c=='E'||c=='W'){ctx.fillStyle='#ffd54a';ctx.fillRect(X,Y,T,T);ctx.fillStyle='#310';ctx.font='20px sans-serif';ctx.fillText(c=='E'?'➜':'⬅',X+6,Y+23)}
  else if(c=='B'){ctx.fillStyle='#4a1a4a';ctx.beginPath();ctx.arc(X+16,Y+16,13,0,7);ctx.fill()}}
 m.npcs.forEach(n=>human(n.x*T+16,n.y*T+16,n.c,1,0));
 if(G.map=='f'&&!G.flags.boss)mon({...E.boss,id:'boss'},12*T+16,5*T+14,1.1,t);
 let px=G.x,py=G.y,b=0;if(mv){px=mv.fx+(mv.tx-mv.fx)*mv.t;py=mv.fy+(mv.ty-mv.fy)*mv.t;b=Math.sin(mv.t*Math.PI*2)*2}
 human(px*T+16,py*T+16,'#59f',1,b);ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.fillText(G.map=='v'?'Codehaven Village':'Syntax Forest',8,14)}
function drawBattle(t){const g=ctx.createLinearGradient(0,0,0,352);g.addColorStop(0,'#2a1a4a');g.addColorStop(1,'#1a3a3a');ctx.fillStyle=g;ctx.fillRect(0,0,480,352);ctx.fillStyle='#0a1a1a';ctx.fillRect(0,290,480,62);
 B.foes.forEach((f,i)=>{const p=fp(f);if(f.hp<=0)return;if(f.hit>0){f.hit--;if(f.hit%4<2)return}mon(f,p.x,p.y,p.s,t);ctx.fillStyle='#fff';ctx.font='11px sans-serif';if(f.boss){ctx.fillText(f.n+(B.scan?' (แพ้ '+WN[f.weak]+')':''),20,12);ctx.fillStyle='#000a';ctx.fillRect(20,16,280,10);ctx.fillStyle='#e44';ctx.fillRect(20,16,280*f.hp/f.mhp,10)}else{ctx.fillText(f.n+(B.scan?' ['+WN[f.weak]+']':''),p.x-35,p.y+32);bar(p.x-30,p.y+36,60,f.hp,f.mhp,'#e44')}});
 G.party.forEach((m,i)=>{const p=pp(m);if(m.hit>0){m.hit--;if(m.hit%4<2)return}human(p.x,p.y,m.c,1.2,Math.sin(t/400+i)*1.5,m.hp<=0);ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.fillText(m.n+' '+m.hp+'/'+m.mhp,p.x-34,p.y+26);bar(p.x-34,p.y+29,68,m.hp,m.mhp,'#4d4');bar(p.x-34,p.y+36,68,m.mp,m.mmp,'#48f')});
 fxs=fxs.filter(f=>f.l>0);fxs.forEach(f=>{f.l--;f.y-=.5;ctx.globalAlpha=Math.min(1,f.l/20);ctx.fillStyle=f.col;ctx.font='bold 16px sans-serif';ctx.fillText(f.txt,f.x-16,f.y);ctx.globalAlpha=1})}
function drawTitle(t){const g=ctx.createLinearGradient(0,0,0,352);g.addColorStop(0,'#10104a');g.addColorStop(1,'#3a1a5a');ctx.fillStyle=g;ctx.fillRect(0,0,480,352);ctx.fillStyle='#fff';for(let i=0;i<40;i++)ctx.fillRect((i*97)%480,(i*53)%200,2,2);ctx.fillStyle='#ffd54a';ctx.font='bold 44px sans-serif';ctx.textAlign='center';ctx.fillText('HTML SAGA',240,120);ctx.fillStyle='#9cf';ctx.font='18px sans-serif';ctx.fillText('CODE CHRONICLES',240,150);ctx.textAlign='left';P.forEach((p,i)=>human(120+i*80,250,p.c,1.6,Math.sin(t/300+i)*3))}
let last=0;function loop(t){const dt=Math.min(50,t-last);last=t;try{ctx.clearRect(0,0,480,352);
 if(mode=='title')drawTitle(t);else if(G){if(mv){mv.t+=dt/130;if(mv.t>=1){mv=null;arrive()}}else if(dir&&mode=='explore')tryMove(dir[0],dir[1]);if(inB&&B)drawBattle(t);else drawMap(t)}}catch(e){console.error(e)}requestAnimationFrame(loop)}
function tryMove(dx,dy){const m=MAPS[G.map],nx=G.x+dx,ny=G.y+dy,ch=m.r[ny]&&m.r[ny][nx];if(!ch||'#T'.includes(ch))return;const n=m.npcs.find(n=>n.x==nx&&n.y==ny);if(n){dir=null;talk(n.id);return}mv={fx:G.x,fy:G.y,tx:nx,ty:ny,t:0};G.x=nx;G.y=ny}
// ---------- input ----------
const KM={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{const k=KM[e.key]||KM[e.key.toLowerCase()];if(k){dir=k;e.preventDefault()}else if((e.key=='m'||e.key=='Escape')&&mode=='explore')menu()});
addEventListener('keyup',e=>{const k=KM[e.key]||KM[e.key.toLowerCase()];if(k&&dir===k)dir=null});
addEventListener('blur',()=>dir=null);
document.querySelectorAll('[data-d]').forEach(b=>{const d=b.dataset.d.split(',').map(Number),on=e=>{e.preventDefault();dir=d},off=()=>{dir=null};b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off))});
$('mb').onclick=()=>{if(mode=='explore')menu()};
requestAnimationFrame(loop);title();
</script></body></html>
